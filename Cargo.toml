[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/daemon",
    "crates/tray",
]

# Shared dependency versions and metadata for all member crates.
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nikita <qnicks@gmail.com>"]
license = "MIT"
repository = "https://github.com/qnicks/screentime"
rust-version = "1.78"

[workspace.dependencies]
# IPC + serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "fs",
    "signal",
    "sync",
    "process",
] }

# Time
chrono = { version = "0.4", features = ["clock", "serde"] }

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# UNIX-y bits (peer creds, utmpx)
nix = { version = "0.29", features = ["socket", "user"] }
libc = "0.2"

# Cocoa interop for the menu-bar tray (macOS only — consumed by the tray
# crate behind `[target.'cfg(target_os = "macos")'.dependencies]`).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSTimer",
    "NSDate",
    "NSObject",
    "NSThread",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSControl",
    "NSButton",
    "NSCell",
    "NSView",
    "NSWindow",
] }
block2 = "0.6"

# Internal
screentime-proto = { path = "crates/proto" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
