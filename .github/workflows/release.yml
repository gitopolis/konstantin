name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $TAG ($VERSION) for ${{ matrix.target }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Update workspace version (uncommitted)
        run: |
          set -euo pipefail
          cargo set-version --workspace "$VERSION"
          grep -nE '^version[[:space:]]*=' Cargo.toml

      - name: Build release binaries
        run: |
          set -euo pipefail
          cargo build --release --workspace --target "${{ matrix.target }}"
          mkdir -p target/release
          for bin in screentimed konstantin-status konstantin-tray konstantin-updater; do
            cp "target/${{ matrix.target }}/release/$bin" "target/release/$bin"
          done

      # Set up an ephemeral keychain holding the Developer ID identity
      # so `codesign` (invoked by build-app.sh) can find it. The keychain
      # is local to $RUNNER_TEMP and gets discarded with the runner —
      # nothing leaks across jobs. We also pull Apple's G2 intermediate
      # because the .p12 export sometimes ships only the leaf.
      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" \
            -T /usr/bin/codesign
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make our keychain the default search path so codesign finds
          # the identity by name. Preserve existing entries so other
          # tools keep working.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build .app bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: bash packaging/build-app.sh

      # Notarize and staple before zipping for distribution. The notary
      # service blocks for ~30 s – a few minutes; --wait keeps the step
      # honest. Stapling embeds the ticket so first-launch on a fresh
      # Mac doesn't need internet.
      - name: Notarize and staple
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent target/Konstantin.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" \
            --wait
          xcrun stapler staple target/Konstantin.app
          xcrun stapler validate target/Konstantin.app
          rm "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Zip bundle
        run: |
          set -euo pipefail
          cd target
          zip -r "Konstantin-${VERSION}-${{ matrix.arch }}.zip" Konstantin.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: konstantin-${{ matrix.arch }}
          path: target/Konstantin-${{ env.VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=1" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=0" >> "$GITHUB_ENV"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$IS_PRERELEASE" == "1" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" \
            artifacts/*/*.zip \
            --title "Konstantin $TAG" \
            --generate-notes \
            "${args[@]}"

  bump-tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-26
    steps:
      - name: Extract version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: gitopolis/homebrew-konstantin
          token: ${{ secrets.TAP_PAT }}
          path: tap

      - name: Register local tap checkout
        run: brew tap gitopolis/konstantin "$PWD/tap"

      - name: Update cask formula
        run: |
          set -euo pipefail
          brew bump-cask-pr \
            --write-only \
            --no-audit \
            --no-style \
            --version-arm "$VERSION" \
            --version-intel "$VERSION" \
            gitopolis/konstantin/konstantin
          cp "$(brew --repository gitopolis/konstantin)/Casks/konstantin.rb" \
            tap/Casks/konstantin.rb
          sed -n '1,16p' tap/Casks/konstantin.rb

      - name: Commit and push
        run: |
          set -euo pipefail
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "::notice::cask is already at $VERSION — nothing to commit"
            exit 0
          fi
          git add Casks/konstantin.rb
          git commit -m "konstantin ${VERSION}"
          git push origin HEAD
