name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $TAG ($VERSION) for ${{ matrix.target }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Update workspace version (uncommitted)
        run: |
          set -euo pipefail
          cargo set-version --workspace "$VERSION"
          grep -nE '^version[[:space:]]*=' Cargo.toml

      - name: Build release binaries
        run: |
          set -euo pipefail
          cargo build --release --workspace --target "${{ matrix.target }}"
          mkdir -p target/release
          for bin in screentimed konstantin-status konstantin-tray; do
            cp "target/${{ matrix.target }}/release/$bin" "target/release/$bin"
          done

      - name: Build .app bundle
        run: bash packaging/build-app.sh

      - name: Zip bundle
        run: |
          set -euo pipefail
          cd target
          zip -r "Konstantin-${VERSION}-${{ matrix.arch }}.zip" Konstantin.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: konstantin-${{ matrix.arch }}
          path: target/Konstantin-${{ env.VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            artifacts/*/*.zip \
            --title "Konstantin $TAG" \
            --generate-notes

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download release zip and compute sha256
        run: |
          set -euo pipefail
          ASSET="Konstantin-${VERSION}-arm64.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          curl -fsSL -o "$ASSET" "$URL"
          SHA256=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "Computed sha256 for $ASSET: $SHA256"

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: gitopolis/homebrew-konstantin
          token: ${{ secrets.TAP_PAT }}
          path: tap

      - name: Update cask formula
        run: |
          set -euo pipefail
          cd tap
          # Cask is Ruby, not TOML — sed against uniquely-formatted lines
          # is the right tool here.
          sed -i.bak -E "s|^  version \"[^\"]+\"|  version \"${VERSION}\"|" Casks/konstantin.rb
          sed -i.bak -E "s|^  sha256 \"[^\"]+\"|  sha256 \"${SHA256}\"|"   Casks/konstantin.rb
          rm Casks/konstantin.rb.bak
          grep -E '^  (version|sha256)' Casks/konstantin.rb

      - name: Commit and push
        run: |
          set -euo pipefail
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "::notice::cask is already at $VERSION/$SHA256 — nothing to commit"
            exit 0
          fi
          git add Casks/konstantin.rb
          git commit -m "konstantin ${VERSION}"
          git push origin HEAD
