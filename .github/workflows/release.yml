name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $TAG ($VERSION) for ${{ matrix.target }}"

      - name: Update workspace version (uncommitted)
        uses: colt-1/toml-editor@1.1.1
        with:
          file: Cargo.toml
          key: workspace.package.version
          value: ${{ env.VERSION }}

      - name: Show updated version line
        run: grep '^version' Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          set -euo pipefail
          cargo build --release --workspace --target "${{ matrix.target }}"
          mkdir -p target/release
          for bin in screentimed konstantin-status konstantin-tray; do
            cp "target/${{ matrix.target }}/release/$bin" "target/release/$bin"
          done

      - name: Build .app bundle
        run: bash packaging/build-app.sh

      - name: Zip bundle
        run: |
          set -euo pipefail
          cd target
          zip -r "Konstantin-${VERSION}-${{ matrix.arch }}.zip" Konstantin.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: konstantin-${{ matrix.arch }}
          path: target/Konstantin-${{ env.VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            artifacts/*/*.zip \
            --title "Konstantin $TAG" \
            --generate-notes
