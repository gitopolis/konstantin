# Example screentimed config.
#
# Install location: /etc/screentimed/config.toml (root-owned, mode 0600).
# Edit either via the menu-bar app's `Configure…` (recommended — saves
# atomically and reloads the daemon) or directly as root and then run
# `sudo launchctl kickstart -k system/com.gitopolis.screentimed`.

socket_path  = "/var/run/screentimed.sock"
state_path   = "/var/db/screentimed/state.json"
tick_seconds = 5

# Notify the user at these many minutes remaining (handled by the tray).
warn_thresholds_minutes = [10, 2, 1]

# What to do with users not listed in [users.*].
#   "unrestricted" — ignore them (logged but never kicked).
#   "block"        — kick them on first tick. DO NOT use until you've added
#                    every account that should be allowed in.
default_policy = "unrestricted"

# Master safety switch.
#   "logout" — actually invoke `launchctl bootout` when limits hit.
#              This is the default and the whole point of running this.
#   "log"    — only log "would have kicked" lines; never actually log
#              anyone out. Useful while you're tuning limits or doing
#              first-time daemon bring-up on a new machine.
enforcement = "logout"

# Live kill-switch. If this file exists, the daemon will refuse to invoke
# `launchctl bootout` regardless of `enforcement`. Touch it to disable
# enforcement in an emergency without restarting the daemon; remove it to
# re-enable. Default: /etc/screentimed/disable.
# kill_switch_path = "/etc/screentimed/disable"

# Test users (create them first — see packaging/install.sh).
[users.alice]
daily_limit_minutes = 30

[users.bob]
daily_limit_minutes = 60
