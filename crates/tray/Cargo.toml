[package]
name = "screentime-tray"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Per-user menu-bar client for the screentime daemon."

# Two binaries:
#   * `screentime-status` — headless CLI, prints status as JSON or human text.
#                           Lives here so the workspace compiles cross-platform
#                           and we have something testable before the UI exists.
#   * `screentime-tray`   — (TODO) the actual NSStatusItem menu-bar app.

[[bin]]
name = "screentime-status"
path = "src/bin/status.rs"

[dependencies]
screentime-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
