[package]
name = "konstantin-tray"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Per-user menu-bar client for the Konstantin daemon."

# Two binaries:
#   * `konstantin-status` — headless CLI, prints status as JSON or human text.
#                           Cross-platform.
#   * `konstantin-tray`   — the menu-bar app. macOS only (NSStatusItem).

[[bin]]
name = "konstantin-status"
path = "src/bin/status.rs"

[[bin]]
name = "konstantin-tray"
path = "src/bin/tray.rs"

[dependencies]
konstantin-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `plist` parses the XML output of `dscl -plist` for user-attribute lookups
# (NFSHomeDirectory, Picture, JPEGPhoto). Light dep, well-maintained.
plist = "1"

# In-app updater. `ureq` is synchronous, blocking, rustls-backed (no system
# OpenSSL link). `sha2` verifies the SHA-256 GitHub returns for each
# release asset. `semver` compares `tag_name` against the running version.
#
# `rustls` (not `_tls`) is the public feature that enables an actual TLS
# backend — `_tls` on its own is an internal sentinel that pulls in PKI
# types but no provider, and HTTPS calls panic at runtime.
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
sha2 = { workspace = true }
semver = { version = "1", features = ["serde"] }

# Cocoa bindings for `konstantin-tray`. macOS only — on other targets the
# tray binary stubs out to a `compile_error!` shim and these crates aren't
# resolved.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-user-notifications = { workspace = true }
block2 = { workspace = true }
