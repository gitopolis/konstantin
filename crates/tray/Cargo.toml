[package]
name = "screentime-tray"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Per-user menu-bar client for the screentime daemon."

# Two binaries:
#   * `screentime-status` — headless CLI, prints status as JSON or human text.
#                           Cross-platform.
#   * `screentime-tray`   — the menu-bar app. macOS only (NSStatusItem).

[[bin]]
name = "screentime-status"
path = "src/bin/status.rs"

[[bin]]
name = "screentime-tray"
path = "src/bin/tray.rs"

[dependencies]
screentime-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `plist` parses the XML output of `dscl -plist` for user-attribute lookups
# (NFSHomeDirectory, Picture, JPEGPhoto). Light dep, well-maintained.
plist = "1"

# Cocoa bindings for `screentime-tray`. macOS only — on other targets the
# tray binary stubs out to a `compile_error!` shim and these crates aren't
# resolved.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
block2 = { workspace = true }
